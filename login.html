<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — DisasterWatch</title>
    <meta name="description" content="Sign in to DisasterWatch real-time disaster monitoring system." />
    <link rel="stylesheet" href="styles/main.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse 70% 60% at 30% 40%, rgba(0, 212, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 80% 70%, rgba(168, 85, 247, 0.08) 0%, transparent 60%),
                var(--bg-primary);
        }

        .login-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(0, 212, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.025) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 24px;
            animation: fadeInUp 0.6s ease;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .logo-badge {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 12px;
        }

        .login-logo h1 {
            font-size: 1.6rem;
        }

        .login-logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 36px 32px;
        }

        /* Tabs */
        .tab-bar {
            display: flex;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            transition: var(--transition-fast);
        }

        .tab-btn.active {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Input with icon */
        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-icon-wrapper .form-control {
            padding-left: 40px;
        }

        .form-forgot {
            text-align: right;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        .form-forgot a {
            font-size: 0.82rem;
            color: var(--accent-cyan);
        }

        .form-forgot a:hover {
            text-decoration: underline;
        }

        .btn-full {
            width: 100%;
            justify-content: center;
            border-radius: var(--radius-sm);
            padding: 14px;
            font-size: 1rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .social-btns {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 11px;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .form-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .switch {
            width: 42px;
            height: 22px;
            background: var(--bg-primary);
            border-radius: 11px;
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            transition: var(--transition-fast);
            flex-shrink: 0;
        }

        .switch::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--text-muted);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: var(--transition-fast);
        }

        .switch.on {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--accent-cyan);
        }

        .switch.on::after {
            left: 22px;
            background: var(--accent-cyan);
        }

        .switch-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
            font-size: 0.83rem;
            color: var(--text-muted);
        }

        .back-home a {
            color: var(--accent-cyan);
        }

        .alert-msg {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            margin-bottom: 16px;
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.25);
            color: var(--accent-green);
        }

        .alert-error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.25);
            color: var(--accent-red);
        }
    </style>
</head>

<body>
    <div class="login-bg"></div>
    <div class="login-grid"></div>

    <div class="login-container">
        <div class="login-logo">
            <div class="logo-badge">🛰️</div>
            <h1>DisasterWatch</h1>
            <p>Real-Time Disaster Monitoring System</p>
        </div>

        <div class="login-card">
            <!-- Tabs -->
            <div class="tab-bar" role="tablist">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')" role="tab">Sign In</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')" role="tab">Register</button>
            </div>

            <!-- LOGIN PANEL -->
            <div class="tab-panel active" id="panel-login">
                <div id="login-msg"></div>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email Address</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">📧</span>
                            <input id="login-email" type="email" class="form-control"
                                placeholder="admin@disasterwatch.io" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="login-pass">Password</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">🔒</span>
                            <input id="login-pass" type="password" class="form-control" placeholder="••••••••"
                                required />
                        </div>
                    </div>
                    <div class="form-forgot"><a href="#">Forgot password?</a></div>

                    <div class="form-switch">
                        <div class="switch" id="remember-switch" onclick="this.classList.toggle('on')"></div>
                        <label class="switch-label">Stay signed in for 30 days</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="login-btn">
                        Sign In →
                    </button>
                </form>

                <div class="divider">or continue with</div>
                <div class="social-btns">
                    <button class="social-btn">🔵 Google</button>
                    <button class="social-btn">⚫ GitHub</button>
                </div>
            </div>

            <!-- REGISTER PANEL -->
            <div class="tab-panel" id="panel-register">
                <div id="register-msg"></div>
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label" for="reg-name">Full Name</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">👤</span>
                            <input id="reg-name" type="text" class="form-control" placeholder="John Smith" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-email">Email Address</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">📧</span>
                            <input id="reg-email" type="email" class="form-control" placeholder="you@example.com"
                                required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-org">Organization</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">🏢</span>
                            <input id="reg-org" type="text" class="form-control"
                                placeholder="NDMA / Govt Agency / Research" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-pass">Password</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">🔒</span>
                            <input id="reg-pass" type="password" class="form-control" placeholder="Min 8 characters"
                                required minlength="8" />
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Create Account →</button>
                </form>
            </div>
        </div>

        <div class="back-home">← <a href="index.html">Back to Home</a></div>
    </div>

    <script src="js/config.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
        }

        function showMsg(el, msg, type) {
            el.innerHTML = `<div class="alert-msg alert-${type}">${msg}</div>`;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.textContent = 'Signing in...'; btn.disabled = true;
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            if (CONFIG.USE_MOCK) {
                // Mock: any credentials accepted
                setTimeout(() => {
                    localStorage.setItem('auth_token', 'mock_token_123');
                    localStorage.setItem('user_email', email);
                    showMsg(document.getElementById('login-msg'), '✅ Signed in successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 900);
                }, 800);
                return;
            }

            // Real FastAPI call
            try {
                const res = await fetch(CONFIG.API_BASE_URL + CONFIG.ENDPOINTS.LOGIN, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('auth_token', data.access_token);
                    window.location.href = 'dashboard.html';
                } else {
                    showMsg(document.getElementById('login-msg'), '❌ ' + (data.detail || 'Invalid credentials'), 'error');
                    btn.textContent = 'Sign In →'; btn.disabled = false;
                }
            } catch {
                showMsg(document.getElementById('login-msg'), '❌ Cannot connect to server. Check if FastAPI is running.', 'error');
                btn.textContent = 'Sign In →'; btn.disabled = false;
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            showMsg(document.getElementById('register-msg'),
                CONFIG.USE_MOCK
                    ? '✅ Account created! <a href="#" onclick="switchTab(\'login\')">Sign in now</a>'
                    : '⚙️ Connect FastAPI backend to enable registration.',
                'success');
        }
    </script>
</body>

</html>
