# ============================================================
# Kubernetes Deployment — DisasterWatch Frontend (Nginx)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disasterwatch-frontend
  labels:
    app: disasterwatch-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disasterwatch-frontend
  template:
    metadata:
      labels:
        app: disasterwatch-frontend
    spec:
      containers:
        - name: frontend
          image: disasterwatch/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: disasterwatch-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
---
# ============================================================
# Kubernetes Deployment — DisasterWatch Backend (FastAPI)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disasterwatch-backend
  labels:
    app: disasterwatch-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disasterwatch-backend
  template:
    metadata:
      labels:
        app: disasterwatch-backend
    spec:
      containers:
        - name: backend
          image: disasterwatch/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: DB_NAME
              value: "disaster_db"
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: disasterwatch-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
# ============================================================
# Secret — Database credentials (base64 encoded in real use)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  host:     "mysql-service"
  username: "root"
  password: "changeme"
