version: '3.8'

services:

  # ── Frontend (Nginx serving HTML/CSS/JS) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - disasterwatch-net

  # ── Backend (FastAPI + Python) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-password}
      - DB_NAME=${DB_NAME:-disaster_db}
      - SECRET_KEY=${SECRET_KEY:-changeme-secret-key}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - disasterwatch-net
    restart: unless-stopped

  # ── MySQL Database ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-password}
      MYSQL_DATABASE: ${DB_NAME:-disaster_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disasterwatch-net

networks:
  disasterwatch-net:
    driver: bridge

volumes:
  mysql_data:
